name: Pages (disabled template)
on:
  workflow_dispatch:
permissions: {}
env:
  SITE_URL: https://oliwill.github.io
  SITE_BASE: /spaceofbaozi
concurrency:
  group: ${{ github.repository }}-github-pages
  cancel-in-progress: false
jobs:
  build:
    # 尚未获准启用；必须另行审阅代码改动，禁止改为输入或变量开关。
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      deployments: read
      pages: read
    outputs:
      baseline: ${{ steps.content.outputs.baseline }}
      source_sha: ${{ steps.content.outputs.source_sha }}
      ready: ${{ steps.content.outputs.current }}
      artifact_id: ${{ steps.upload.outputs.artifact_id }}
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.2'
      - run: bun install --frozen-lockfile
      - id: start
        run: bun run publishing:start
      - if: steps.start.outputs.current == 'true'
        run: bun run check && bun run test:unit
      - id: content
        if: steps.start.outputs.current == 'true'
        run: bun run publishing:prepare
      - if: steps.content.outputs.current == 'true'
        run: bun run build
      - if: steps.content.outputs.current == 'true'
        run: bun run publishing:audit
      - id: upload
        if: steps.content.outputs.current == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
  deploy:
    # 尚未获准启用；启用后仍须检查 build.ready、可信分支和环境保护。
    if: ${{ false }}
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      deployments: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      deployed: ${{ steps.guard.outputs.current }}
    env:
      GITHUB_TOKEN: ${{ github.token }}
      EXPECTED_BASELINE: ${{ needs.build.outputs.baseline }}
      EXPECTED_SOURCE_SHA: ${{ needs.build.outputs.source_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.2'
      - run: bun install --frozen-lockfile
      - id: guard
        run: bun run publishing:guard
      - id: deployment
        if: steps.guard.outputs.current == 'true'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
  verify:
    # 尚未获准启用；此只读核验 job 不声明部署环境。
    if: ${{ false }}
    needs: [build, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      deployments: read
      pages: read
    env:
      GITHUB_TOKEN: ${{ github.token }}
      EXPECTED_SOURCE_SHA: ${{ needs.build.outputs.source_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.2'
      - run: bun install --frozen-lockfile
      - if: needs.deploy.outputs.deployed == 'true'
        run: bun run publishing:verify
